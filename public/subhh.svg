<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Crimson Background Gradient -->
    <linearGradient id="bgGradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0508" />
      <stop offset="50%" stop-color="#0f0204" />
      <stop offset="100%" stop-color="#050001" />
    </linearGradient>

    <!-- Crimson to Scarlet Fire Gradient -->
    <linearGradient id="redFireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="30%" stop-color="#E60000" />
      <stop offset="70%" stop-color="#990000" />
      <stop offset="100%" stop-color="#4A0000" />
    </linearGradient>

    <!-- Intense Bright Red/Coral Core Gradient -->
    <linearGradient id="redCoreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFB3B3" />
      <stop offset="100%" stop-color="#FF1A1A" />
    </linearGradient>

    <!-- Deep Ruby Outer Shadow Accent -->
    <linearGradient id="rubyBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CC0000" />
      <stop offset="100%" stop-color="#330000" />
    </linearGradient>

    <!-- Crimson Glow Effect -->
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Container Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradRed)" />

  <!-- Outer Crimson Ambient Aura -->
  <path
    d="M 330 110 C 330 110 270 60 210 110 C 150 160 130 220 190 280 C 250 340 370 280 350 380 C 330 460 210 460 150 400"
    fill="none"
    stroke="#FF0000"
    stroke-width="50"
    stroke-linecap="round"
    opacity="0.3"
    filter="url(#redGlow)"
  />

  <!-- Background Flame Licks -->
  <path
    d="M 170 120 Q 150 70 190 50 Q 195 90 170 120 Z
       M 320 140 Q 360 80 340 50 Q 300 90 320 140 Z
       M 130 310 Q 80 270 110 230 Q 140 270 130 310 Z
       M 380 320 Q 430 280 400 230 Q 370 270 380 320 Z
       M 270 450 Q 310 480 340 440 Q 310 420 270 450 Z"
    fill="url(#rubyBaseGrad)"
  />

  <!-- Primary Red Flame 'S' Body -->
  <path
    filter="url(#redGlow)"
    fill="url(#redFireGrad)"
    d="M 355 160 
       C 355 110, 310 65, 245 65 
       C 175 65, 125 110, 125 175 
       C 125 210, 145 240, 175 260 
       C 200 275, 235 285, 275 295
       C 325 310, 365 335, 365 380
       C 365 435, 310 465, 235 465
       C 160 465, 105 420, 110 350
       C 110 335, 125 325, 140 325
       C 155 325, 165 335, 170 350
       C 178 385, 205 410, 240 410
       C 280 410, 310 390, 310 360
       C 310 335, 290 315, 255 305
       C 210 290, 170 275, 145 255
       C 105 225, 75 185, 75 130
       C 75 60, 145 15, 250 15
       C 320 15, 385 55, 395 125
       C 398 145, 380 160, 365 160
       Z"
  />

  <!-- High-Temperature White/Pink Inner Fire Core -->
  <path
    fill="url(#redCoreGrad)"
    d="M 330 145 
       C 325 110, 285 85, 240 85 
       C 185 85, 145 120, 145 165 
       C 145 190, 160 215, 190 232
       C 215 245, 255 260, 290 270
       C 340 285, 380 315, 380 365
       C 380 415, 335 445, 260 445
       C 205 445, 155 420, 145 380
       C 143 370, 152 360, 162 360
       C 172 360, 180 367, 185 375
       C 195 395, 220 415, 255 415
       C 295 415, 325 395, 325 365
       C 325 345, 305 330, 270 320
       C 225 305, 185 290, 160 270
       C 125 240, 105 205, 105 155
       C 105 95, 165 45, 250 45
       C 305 45, 350 80, 360 130
       C 362 142, 342 150, 330 145
       Z"
    opacity="0.9"
  />

  <!-- Floating Red Embers -->
  <circle cx="140" cy="100" r="6" fill="#FFB3B3" />
  <circle cx="370" cy="100" r="8" fill="#FF3333" />
  <circle cx="390" cy="220" r="5" fill="#CC0000" />
  <circle cx="100" cy="260" r="7" fill="#FF1A1A" />
  <circle cx="120" cy="420" r="5" fill="#FFB3B3" />
</svg>
